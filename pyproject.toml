[project]
name = "astrobot-mcp"
version = "0.1.0"
description = "MCP server for astrophotography planning — weather, DSO catalog, ephemeris, and observation planning"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.12.0",
    "httpx>=0.27.0",
    "skyfield>=1.49",
    "astroplan>=0.10",
    "astropy>=6.0",
    "pyongc>=1.2.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
astrobot-mcp = "astrobot_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
