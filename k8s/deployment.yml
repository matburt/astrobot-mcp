apiVersion: v1
kind: Namespace
metadata:
  name: astrobot-mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrobot-mcp
  namespace: astrobot-mcp
  labels:
    app: astrobot-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: astrobot-mcp
  template:
    metadata:
      labels:
        app: astrobot-mcp
    spec:
      containers:
        - name: astrobot-mcp
          image: ghcr.io/matburt/astrobot-mcp:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASTROSPHERIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: astrobot-mcp-secrets
                  key: ASTROSPHERIC_API_KEY
            - name: SKYFIELD_DATA_DIR
              value: /data/skyfield
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: astrobot-mcp
  namespace: astrobot-mcp
spec:
  selector:
    app: astrobot-mcp
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
